<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buon Compleanno</title>

<style>
body {
    margin: 0;
    font-family: "Georgia", serif;
    background: radial-gradient(circle at top, #efe3f7, #d6c0e8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #3a2c3f;
    overflow: hidden;
}

/* TORTA */
.cake {
    position: relative;
    width: 280px;
    height: 200px;
}

/* STRATI */
.layer {
    position: absolute;
    width: 100%;
    border-radius: 14px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
}

.layer-bottom {
    height: 70px;
    bottom: 0;
    background: linear-gradient(#d8a47f, #c48a63);
}

.layer-middle {
    height: 60px;
    bottom: 70px;
    background: #fff;
}

.layer-top {
    height: 50px;
    bottom: 130px;
    background: linear-gradient(#f7a8c2, #f48fb1);
}

/* CREMA */
.cream {
    position: absolute;
    top: -12px;
    width: 100%;
    height: 30px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 5px 10px rgba(0,0,0,0.15);
}

/* FRAGOLE */
.strawberry {
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle at 30% 30%, #ff4d4d, #c4002f);
    border-radius: 50%;
    top: -18px;
}

.strawberry::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    background: #3fa34d;
    top: -4px;
    left: 5px;
    border-radius: 2px;
}

/* CANDELINE */
.candle {
    position: absolute;
    width: 12px;
    height: 45px;
    background: repeating-linear-gradient(
        45deg,
        #ffffff,
        #ffffff 3px,
        #ffd6e7 3px,
        #ffd6e7 6px
    );
    border-radius: 4px;
    top: -60px;
}

/* FIAMMA */
.flame {
    position: absolute;
    top: -14px;
    left: 2px;
    width: 8px;
    height: 14px;
    background: radial-gradient(circle, #ffd54f, #ff6f00);
    border-radius: 50%;
    animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.3); opacity: 0.6; }
}

/* FUMO */
.smoke {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(200,200,200,0.6);
    border-radius: 50%;
    animation: smokeUp 2s forwards;
}

@keyframes smokeUp {
    0% { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(-40px); opacity: 0; }
}

/* NUMERO */
.number {
    font-size: 48px;
    margin-top: 10px;
    letter-spacing: 5px;
}

/* TESTO */
.message {
    max-width: 600px;
    font-size: 18px;
    line-height: 1.6;
    margin-top: 20px;
}

/* TULIPANI */
.tulips {
    position: absolute;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 0 20px;
}

.tulip {
    position: relative;
    width: 20px;
    height: 70px;
}

.flower {
    width: 20px;
    height: 22px;
    background: #d46a92;
    border-radius: 50% 50% 0 0;
}

.stem {
    width: 4px;
    height: 45px;
    background: #2e7d32;
    margin: auto;
}
</style>

</head>

<body>

<div class="cake" id="cake">
    <div class="layer layer-bottom"></div>
    <div class="layer layer-middle"></div>
    <div class="layer layer-top"></div>
    <div class="cream"></div>

<script>
function spegniCandeline() {
    document.querySelectorAll('.flame').forEach(f => {
        let parent = f.parentElement;

        // rimuove fiamma
        f.remove();

        // crea fumo
        for(let i=0;i<3;i++){
            let smoke = document.createElement("div");
            smoke.className = "smoke";
            smoke.style.left = "3px";
            smoke.style.top = "-10px";
            parent.appendChild(smoke);

            setTimeout(()=>smoke.remove(),2000);
        }
    });
}

// automatico dopo 4 secondi
setTimeout(spegniCandeline, 4000);

// click per soffiare
document.body.addEventListener("click", spegniCandeline);
</script>

</body>
