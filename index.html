<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Desiderio Speciale ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --lilla-sfondo: #f5f0f9;
            --lilla-medio: #b39ddb;
            --lilla-testo: #5e548e;
            --fragola: #ff4d6d;
            --crema: #fffdf5;
            --biscotto: #e6be8a;
        }

        body {
            background-color: var(--lilla-sfondo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            transition: background-color 3s ease;
            overflow: hidden;
        }

        body.dark-mode {
            background-color: #e2daeb;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* --- TIRAMISÙ ARTIGIANALE --- */
        .dolce-wrapper {
            position: relative;
            width: 320px;
            margin: 0 auto 40px;
        }

        .tiramisu {
            width: 280px;
            height: 170px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px 20px 10px 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(94, 84, 142, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            margin: 0 auto;
        }

        /* Strati del Tiramisù */
        .layer { position: absolute; width: 100%; left: 0; }
        
        .layer-savoiardi-base { bottom: 0; height: 30%; background: var(--biscotto); border-top: 1px solid #d4a373; }
        
        .layer-crema-fragole { 
            bottom: 30%; height: 45%; 
            background: var(--crema); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 0 10px;
        }

        .layer-savoiardi-top { bottom: 75%; height: 15%; background: #f0dcc0; opacity: 0.9; }
        
        .layer-top { bottom: 90%; height: 10%; background: var(--crema); }

        /* Fette di fragola nel tiramisù */
        .fragola-slice {
            width: 28px;
            height: 35px;
            background: var(--fragola);
            border-radius: 50% 50% 35% 35%;
            position: relative;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .fragola-slice::after {
            content: ''; position: absolute; top: 5px; left: 50%; 
            width: 2px; height: 10px; background: rgba(255,255,255,0.3);
            transform: translateX(-50%); border-radius: 2px;
        }

        .fragole-guarnizione {
            position: absolute;
            top: -18px;
            width: 100%;
