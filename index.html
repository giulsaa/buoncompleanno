<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Desiderio per Te ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --lilla-soft: #f4eeff;
            --lilla-dark: #8e7cc3;
            --fragola: #ff5e78;
            --fragola-soft: #ffccd5;
            --crema: #fffdf5;
            --biscotto: #e8c39e;
        }

        body {
            background-color: var(--lilla-soft);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            transition: background-color 2.5s ease;
        }

        body.spento { background-color: #e2d5f0; }

        .container {
            text-align: center;
            position: relative;
            z-index: 5;
        }

        /* --- TIRAMISÙ ALLE FRAGOLE --- */
        .dolce-container {
            position: relative;
            width: 300px;
            margin: 0 auto 40px;
        }

        .tiramisu {
            width: 280px;
            height: 160px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
            margin: 0 auto;
        }

        /* Strati */
        .strato { position: absolute; width: 100%; left: 0; }
        .base { bottom: 0; height: 30%; background: var(--biscotto); }
        .crema-middle { bottom: 30%; height: 40%; background: var(--crema); display: flex; justify-content: space-around; align-items: center; }
        .savoiardi-2 { bottom: 70%; height: 15%; background: #f0dcc0; }
        .crema-top { bottom: 85%; height: 15%; background: var(--crema); }

        /* Fragole dentro la crema */
        .fragola-slice {
            width: 25px;
            height: 30px;
            background: var(--fragola);
            border-radius: 50% 50% 30% 30%;
            opacity: 0.8;
            position: relative;
        }

        /* Fragole sopra */
        .fragole-top {
            position: absolute;
            top: -15px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            z-index: 2;
        }

        /* --- CANDELINA --- */
        .candelina-box {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stelo {
            width: 6px;
            height: 40px;
            background: linear-gradient(to bottom, var(--lilla-dark), #c5b4e3);
            border-radius: 3px;
            position: relative;
        }

        .numero-23 {
            position: absolute;
            right: -35px;
            top: -5px;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: bold;
            color: var(--lilla-dark);
        }

        .fiamma {
            width: 12px;
            height: 20px;
            background: #ffdb58;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -22px;
            left: -3px;
            box-shadow: 0 0 15px #ffcc00;
            animation: flickering 0.15s infinite alternate;
            transition: opacity 0.8s ease;
        }

        @keyframes flickering {
            0% { transform: scale(1) rotate(-1deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(1deg); opacity: 1; }
        }

        /* --- TESTO --- */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #4a3f5a;
            font-size: 26px;
            margin-bottom: 10px;
            font-style: italic;
        }

        p {
            color: #6b5b7b;
            font-size: 17px;
            line-height: 1.5;
            max-width: 400px
