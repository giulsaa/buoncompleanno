<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buon Compleanno</title>

<style>
body {
    margin: 0;
    font-family: "Playfair Display", serif;
    background: linear-gradient(135deg, #e9ddf3, #d8c6ea);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #2f2433;
}

/* CONTENITORE */
.container {
    text-align: center;
}

/* TORTA */
.cake {
    position: relative;
    width: 260px;
    height: 180px;
    margin: auto;
}

/* STRATI */
.layer {
    position: absolute;
    width: 100%;
    border-radius: 12px;
}

.bottom {
    height: 60px;
    bottom: 0;
    background: linear-gradient(#d9a07a, #c48763);
}

.middle {
    height: 50px;
    bottom: 60px;
    background: #fff;
}

.top {
    height: 45px;
    bottom: 110px;
    background: linear-gradient(#f4a6c1, #f18fb0);
}

/* CREMA */
.cream {
    position: absolute;
    top: -10px;
    width: 100%;
    height: 25px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

/* FRAGOLE */
.strawberry {
    position: absolute;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 30% 30%, #ff5a5a, #b8002f);
    border-radius: 50%;
    top: -14px;
}

/* CANDELINE */
.candle {
    position: absolute;
    width: 4px;
    height: 40px;
    background: #fdfdfd;
    top: -50px;
}

/* FIAMMA */
.flame {
    position: absolute;
    top: -10px;
    left: -2px;
    width: 8px;
    height: 12px;
    background: radial-gradient(circle, #fff3b0, #ff8c42);
    border-radius: 50%;
    animation: flicker 0.2s infinite alternate;
}

@keyframes flicker {
    from { transform: scale(1); opacity: 0.9; }
    to { transform: scale(1.2); opacity: 0.6; }
}

/* FUMO */
.smoke {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(150,150,150,0.3);
    border-radius: 50%;
    animation: smoke 2s forwards;
}

@keyframes smoke {
    0% { transform: translateY(0); opacity: 0.5; }
    100% { transform: translateY(-50px); opacity: 0; }
}

/* NUMERO */
.number {
    font-size: 42px;
    margin-top: 10px;
    letter-spacing: 6px;
}

/* TESTO */
.message {
    margin-top: 20px;
    max-width: 520px;
    font-size: 17px;
    line-height: 1.6;
    font-weight: 300;
}

/* TULIPANI MINIMAL */
.tulips {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 60px;
    opacity: 0.6;
}

.tulip {
    width: 2px;
    height: 60px;
    background: #4a7c59;
    position: relative;
}

.tulip::before {
    content: "";
    position: absolute;
    top: -12px;
    left: -4px;
    width: 10px;
    height: 12px;
    background: #c97aa3;
    border-radius: 50% 50% 0 0;
}
</style>

</head>

<body>

<div class="container">

<div class="cake">
    <div class="layer bottom"></div>
    <div class="layer middle"></div>
    <div class="layer top"></div>
    <div class="cream"></div>

```
<!-- fragole -->
<div class="strawberry" style="left:30px;"></div>
<div class="strawberry" style="left:80px;"></div>
<div class="strawberry" style="left:130px;"></div>
<div class="strawberry" style="left:180px;"></div>

<!-- candeline -->
<div class="candle" style="left:110px;"><div class="flame"></div></div>
<div class="candle" style="left:140px;"><div class="flame"></div></div>

</div>

<div class="number">23</div>

<div class="message">
buon compleanno, mi raccomando soffia la candelina ed esprimi un desiderio,<br>
e ricorda di desiderare di avere desideri infiniti, si avvereranno tutti!
</div>

</div>

<div class="tulips">
    <div class="tulip"></div>
    <div class="tulip"></div>
    <div class="tulip"></div>
    <div class="tulip"></div>
</div>

<script>
function spegni() {
    document.querySelectorAll('.flame').forEach(f => {
        let p = f.parentElement;
        f.style.opacity = "0";

        let smoke = document.createElement("div");
        smoke.className = "smoke";
        smoke.style.left = "-1px";
        smoke.style.top = "-10px";
        p.appendChild(smoke);

        setTimeout(()=>smoke.remove(),2000);
    });
}

setTimeout(spegni, 4000);
document.body.addEventListener("click", spegni);
</script>

</body>
</html>
